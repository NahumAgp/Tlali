services:
  mysql:
    image: mysql:8.4
    container_name: tlali-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tlali}
      MYSQL_USER: ${MYSQL_USER:-tlali}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tlali}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tlali-root}
    volumes:
      - tlali_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./tlali-back
    container_name: tlali-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-tlali}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-tlali}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-tlali}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      TLALI_JWT_SECRET: ${TLALI_JWT_SECRET:-change-this-secret-in-production-at-least-32-chars}
      TLALI_JWT_EXPIRES_IN_MINUTES: ${TLALI_JWT_EXPIRES_IN_MINUTES:-720}
      TLALI_FRONTEND_AUTH_CALLBACK: ${TLALI_FRONTEND_AUTH_CALLBACK:-http://localhost/auth/callback}
      TLALI_SUPERADMIN_EMAIL: ${TLALI_SUPERADMIN_EMAIL:-nahum.aguilar.per@gmail.com}
      TLALI_SUPERADMIN_PASSWORD: ${TLALI_SUPERADMIN_PASSWORD:-Admin123!}
      TLALI_SUPERADMIN_NAME: ${TLALI_SUPERADMIN_NAME:-Nahum Aguilar}
      TLALI_DEVICE_API_KEY: ${TLALI_DEVICE_API_KEY:-tlali-local-device-key}
      TLALI_FIREBASE_DATABASE_URL: ${TLALI_FIREBASE_DATABASE_URL:-https://tlali-5edc4-default-rtdb.firebaseio.com}
      TLALI_FIREBASE_HISTORY_SYNC_ENABLED: ${TLALI_FIREBASE_HISTORY_SYNC_ENABLED:-true}
      TLALI_FIREBASE_HISTORY_SYNC_FIXED_DELAY_MS: ${TLALI_FIREBASE_HISTORY_SYNC_FIXED_DELAY_MS:-1800000}
      TLALI_FIREBASE_HISTORY_IMPORT_ENABLED: ${TLALI_FIREBASE_HISTORY_IMPORT_ENABLED:-true}
      TLALI_FIREBASE_HISTORY_IMPORT_DAYS: ${TLALI_FIREBASE_HISTORY_IMPORT_DAYS:-90}
      TLALI_FIREBASE_HISTORY_IMPORT_INITIAL_DELAY_MS: ${TLALI_FIREBASE_HISTORY_IMPORT_INITIAL_DELAY_MS:-15000}
      TLALI_FIREBASE_HISTORY_IMPORT_FIXED_DELAY_MS: ${TLALI_FIREBASE_HISTORY_IMPORT_FIXED_DELAY_MS:-900000}
      TLALI_FIREBASE_CLEANUP_ENABLED: ${TLALI_FIREBASE_CLEANUP_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TLALI_OPENAI_MODEL: ${TLALI_OPENAI_MODEL:-gpt-5-mini}
    ports:
      - "${SERVER_PORT:-8080}:8080"

  frontend:
    build:
      context: ./tlali-front
      args:
        VITE_API_URL: ""
    container_name: tlali-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  tlali_mysql_data:
